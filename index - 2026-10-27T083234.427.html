<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nosso Porquinho</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f4;--card:#fff;--tx:#1d2b23;--mut:#6b7a71;--g1:#e6f4ea;--g2:#2f7d4f;--g3:#1f5a38;--ln:#e3e8e4;--red:#b94a48;--red1:#fbeaea;--y1:#fbf1c7;--y2:#8a6d0a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f4f6f4}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45}
button,input,select{font:inherit}
#splash{position:fixed;inset:0;background:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}
#splash svg{width:110px;animation:pop 1.2s ease-out}#splash p{font-weight:800;color:var(--g3);font-size:20px;margin:0}
@keyframes pop{0%{transform:scale(.4) rotate(-10deg);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){#splash svg{animation:none}}
.auth{max-width:380px;margin:8vh auto;padding:24px;text-align:center}.auth svg{width:84px}
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:11px;color:var(--mut);font-weight:600}
nav button b{display:block;font-size:19px;font-weight:400}nav button.on{color:var(--g3)}nav button.on b{filter:none}
nav button.on{background:var(--g1)}
main{padding:14px 14px 90px;max-width:760px;width:100%;margin:0 auto}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}header svg{width:38px}header h1{font-size:19px;margin:0;flex:1;color:var(--g3)}
.seg{display:inline-flex;background:#e8ece9;border-radius:99px;padding:3px}.seg button{border:0;background:none;padding:5px 12px;border-radius:99px;font-weight:600;color:var(--mut)}.seg button.on{background:#fff;color:var(--g3)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:18px;padding:14px;border:1px solid var(--ln);margin-bottom:10px}.grid .card{margin:0}
.card small,.sub{color:var(--mut);font-size:12.5px}.big{font-size:22px;font-weight:800;display:block}
.wide{grid-column:1/-1}.pos{color:var(--g2)}.neg{color:var(--red)}
h2{font-size:17px;margin:18px 0 8px}h3{margin:0 0 10px}
.bar{height:9px;background:var(--g1);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--g2)}
.pri{background:var(--g3);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:800}.ghost{background:#eef1ef;color:var(--tx);border:0;border-radius:12px;padding:10px 16px;font-weight:600}
.sm{padding:6px 11px;font-size:13px;border-radius:10px}.dng{background:var(--red1);color:var(--red)}
.pri:disabled{opacity:.5}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.it:last-child{border:0}.it>div:first-child{flex:1;min-width:0}.it b{display:block}.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--g1);color:var(--g3);font-weight:700}.tag.r{background:var(--red1);color:var(--red)}.tag.y{background:var(--y1);color:var(--y2)}.tag.g{background:#eceeed;color:var(--mut)}
.alert{padding:9px 12px;border-radius:12px;background:var(--y1);color:var(--y2);margin-bottom:8px;font-size:14px}.alert.r{background:var(--red1);color:var(--red)}
.empty{text-align:center;color:var(--mut);padding:22px 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:rgba(20,30,25,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}#modal[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:460px;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}
@media(min-width:600px){#modal{align-items:center}.sheet{border-radius:22px}}
label{display:block;font-weight:600;font-size:13px;margin-bottom:10px}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;margin-top:3px;background:#fff}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--g2);outline-offset:1px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--g3);color:#fff;padding:9px 16px;border-radius:99px;z-index:60;font-weight:600;font-size:14px}
@media(min-width:800px){.shell{grid-template-columns:200px 1fr}nav{position:sticky;top:0;height:100vh;flex-direction:column;border:0;border-right:1px solid var(--ln);justify-content:flex-start;padding-top:20px;gap:2px}nav button{flex:none;text-align:left;padding:11px 16px;font-size:14px;display:flex;gap:10px;align-items:center;border-radius:0}nav button b{display:inline;font-size:17px}main{padding-bottom:30px}.grid{grid-template-columns:repeat(4,1fr)}.wide{grid-column:span 2}}
.big,.it b{font-variant-numeric:tabular-nums}.big{letter-spacing:-.01em}
.hero{background:var(--g3);color:#fff;border:0;padding:18px}.hero small{color:#cfe8d8}.hero .big{font-size:32px}.hero a{color:#fff}
.ic{background:#fff;border:1px solid var(--ln);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;color:var(--g3);cursor:pointer}
.mi{width:auto;margin:0;padding:8px 10px}.alert.ok{background:var(--g1);color:var(--g3)}.gb i{background:#d9b94a}
nav button{min-height:54px}nav .sec,nav .brand{display:none}nav button b{line-height:0;margin-bottom:3px}nav button b svg{display:inline-block}
#splash{background:#eef7f1;padding:24px;overflow:hidden;text-align:center}#splash svg{width:120px}#splash svg.coin{position:absolute;width:44px;opacity:.55}
#splash .w1{font-size:27px;font-weight:800;color:var(--g3);margin:6px 0 0}#splash .w2{font-size:17px;font-weight:600;color:var(--tx);max-width:430px;margin:0}#splash .w3{font-size:14.5px;font-weight:400;color:var(--mut);max-width:400px;margin:0 0 10px}#splash .pri{padding:14px 22px;font-size:16px}
@media(min-width:800px){nav .sec{display:flex}nav .mo{display:none}nav .brand{display:flex;align-items:center;gap:8px;padding:0 16px 18px;font-weight:800;color:var(--g3)}nav .brand svg{width:34px}nav button.on{border-left:4px solid var(--g2)}main{max-width:980px}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:10px}.cal>small{font-weight:700}.cd{border:1px solid var(--ln);background:#fff;border-radius:10px;min-height:48px;padding:4px 0;font-weight:600;cursor:pointer;color:var(--tx)}.cd span{display:block;height:8px}.cd.sel{outline:2px solid var(--g2)}.cd.td{background:var(--g1)}.cd.ng{border-color:var(--red)}.di,.do{display:inline-block;width:6px;height:6px;border-radius:50%;margin:0 1px;text-decoration:none}.di{background:var(--g2)}.do{background:var(--red)}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head><body>
<div id="splash"></div><div id="app"></div><div id="modal" hidden></div>
<script>
const PIG=`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M15 24l-2-11 10 5zM44 19l8-6-1 12z" fill="#8fcfa6"/><ellipse cx="31" cy="36" rx="22" ry="17" fill="#bfe5cb"/><rect x="20" y="47" width="7" height="9" rx="3" fill="#8fcfa6"/><rect x="37" y="47" width="7" height="9" rx="3" fill="#8fcfa6"/><ellipse cx="53" cy="37" rx="6" ry="4.5" fill="#8fcfa6"/><circle cx="51" cy="37" r="1" fill="#1f5a38"/><circle cx="55" cy="37" r="1" fill="#1f5a38"/><circle cx="43" cy="30" r="2" fill="#1f5a38"/><rect x="24" y="21" width="13" height="3.2" rx="1.6" fill="#1f5a38"/><path d="M9 33c-5-1-5-7-1-7" fill="none" stroke="#8fcfa6" stroke-width="3" stroke-linecap="round"/></svg>`;
document.head.insertAdjacentHTML('beforeend',`<link rel="icon" href="data:image/svg+xml,${encodeURIComponent(PIG)}">`);
/* ===== Dados (camada isolada: trocar por Supabase depois) ===== */
let S=freshS();const save=()=>{};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const p2=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const today=()=>iso(new Date());
const addM=(s,n=1)=>{const [y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return iso(new Date(t.getFullYear(),t.getMonth(),Math.min(d,last)))};
const R=v=>S.hide?'R$ ••••':(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const D=s=>s?s.split('-').reverse().join('/'):'—';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?Math.round(n*100)/100:0};
const sum=a=>a.reduce((x,y)=>x+y,0);

function toast(m){const t=document.createElement('div');t.id='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
/* ===== Regras financeiras (centralizadas) ===== */
const paid=b=>sum(b.pay.filter(p=>!p.void).map(p=>p.amt)),rest=b=>Math.max(0,b.amount-paid(b));
function bst(b){if(b.cancel)return['cancelada','g'];if(rest(b)<=0.004)return['paga',''];if(b.due<today())return['vencida','r'];return paid(b)>0?['parcial','y']:['pendente','y']}
const open=b=>!b.cancel&&rest(b)>0.004;
const pays=()=>S.bills.flatMap(b=>b.pay.filter(p=>!p.void).map(p=>({...p,b})));
const bad=d=>{if(!d||d<'2000-01-01'||d>'2100-01-01'){toast('Data inválida');return true}if(d>today()){toast('A data não pode ser futura. Registre quando o dinheiro realmente sair ou entrar.');return true}return false};
const gnet=g=>sum(g.moves.map(m=>m.amt));
const rcv=i=>i.status==='recebido'?i.recvAmt:0;
const bank=()=>Math.round((S.opening+sum(S.incomes.map(rcv))-sum(pays().map(p=>p.amt))-sum(S.goals.map(gnet))-fp()+sum(S.adj.map(a=>a.amt)))*100)/100;
const bal=x=>sum(x.rech.map(r=>r.amt))-sum(x.sp.map(s=>s.amt));
const nextInc=()=>S.incomes.filter(i=>i.status==='previsto'&&i.date>=today()).sort((a,b)=>a.date<b.date?-1:1)[0];
function plan(){const n=nextInc(),lim=n?n.date:null;const before=S.bills.filter(b=>open(b)&&(!lim||b.due<=lim)).concat(fatBills(lim));const comp=sum(before.map(rest));const bk=bank();return{n,before,comp,bk,proj:bk-comp-S.margin}}
/* ===== UI base ===== */
let tab='painel',scope='fam',btab='pend',month=today().slice(0,7),sub='vr';
const mine=x=>scope==='fam'||x.who===S.user;
function form(title,fields,ok,btn='Salvar',msg=''){const m=document.getElementById('modal');
m.innerHTML=`<div class="sheet"><h3>${title}</h3>${msg?`<p class="sub">${msg}</p>`:''}<form id="f">${fields.map(f=>`<label>${f.l}${f.t==='select'?`<select name="${f.k}">${f.o.map(o=>`<option ${o==f.v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v??'')}" ${f.t==='number'?'step="0.01" min="0" inputmode="decimal"':''} ${f.list?`list="${f.list}"`:''} ${f.req?'required':''}>`}</label>`).join('')}<datalist id="cats">${['Moradia','Água/Luz/Internet','Carro','Cartão de crédito','Mercado','Transporte','Saúde','Educação','Assinaturas','Delivery','Outras'].map(c=>`<option>${c}</option>`).join('')}</datalist><div class="row"><button type="button" class="ghost" onclick="closeM()">Cancelar</button><button class="pri">${btn}</button></div></form></div>`;
m.hidden=false;const f=document.getElementById('f');f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('.pri');if(b.disabled)return;b.disabled=true;b.textContent='Salvando…';const d=Object.fromEntries(new FormData(f));try{if(await ok(d)===false){b.disabled=false;b.textContent=btn;return}await load();closeM();render()}catch(err){b.disabled=false;b.textContent=btn;toast(err.message||'Erro ao salvar')}}}
function closeM(){document.getElementById('modal').hidden=true}
const ask=(t,msg,fn)=>form(t,[],()=>fn(),'Confirmar',msg);
const who=()=>S.people;
const whoF=(v)=>({k:'who',l:'Pessoa',t:'select',o:who(),v:v||S.user});
/* ===== Telas ===== */
function splashAndStart(){const s=document.getElementById('splash');const c=(st)=>`<svg class="coin" style="${st}" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="#f7e8a6" stroke="#d9b94a" stroke-width="2"/><path d="M20 11v18M16 15c0-3 8-3 8 0s-8 2-8 5 8 3 8 0" fill="none" stroke="#b8982f" stroke-width="2"/></svg>`;s.innerHTML=c('left:9%;top:14%')+c('right:10%;top:26%')+c('left:16%;bottom:14%')+PIG+`<h1 class="w1">Bem-vindo ao Nosso Porquinho!</h1><p class="w2">Um passo de cada vez, menos dívidas no caminho e mais dinheiro guardado para os seus sonhos.</p><p class="w3">Organize suas contas, acompanhe seu dinheiro e transforme pequenas economias em grandes conquistas.</p><button class="pri" id="go0">Vamos organizar nossas finanças</button>`;const b=document.getElementById('go0');b.onclick=()=>{s.style.opacity=0;setTimeout(()=>s.remove(),450)};b.focus();render()}
function renderApp(){const a=document.getElementById('app');
const T=[['painel',ICO.home,'Painel'],['receb',ICO.wallet,'Recebimentos'],['contas',ICO.receipt,'Contas'],['porco',ICO.coin,'Porquinho'],['vrva',ICO.fork,'VR e VA',1],['plano',ICO.compass,'Planejar',1],['hist',ICO.clock,'Histórico',1],['cartoes',ICO.card,'Cartões e dívidas',1],['calendario',ICO.cal,'Calendário',1],['inteligencia',ICO.spark,'Inteligência',1]];
a.innerHTML=`<div class="shell"><nav><div class="brand">${PIG}Nosso Porquinho</div>${T.map(t=>`<button class="${tab===t[0]?'on':''}${t[3]?' sec':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('')}<button class="mo ${T.some(t=>t[3]&&t[0]===tab)?'on':''}" onclick="more()"><b>${ICO.dots}</b>Mais</button></nav><main><header>${PIG}<h1>Olá, ${esc(S.user)}!</h1><button class="ic" onclick="S.hide=!S.hide;save();render()" aria-label="Ocultar ou mostrar valores">${S.hide?ICO.eyeoff:ICO.eye}</button><button class="ic" onclick="cfg()" aria-label="Configurações">${ICO.gear}</button></header><div class="top" style="margin-bottom:12px"><input class="mi" type="month" value="${month}" aria-label="Mês" onchange="month=this.value||month;render()"><div class="seg"><button class="${scope==='fam'?'on':''}" onclick="scope='fam';render()">Família</button><button class="${scope==='me'?'on':''}" onclick="scope='me';render()">Eu</button></div></div>${({painel,receb,contas,vrva,porco,plano,hist,cartoes,calendario,inteligencia})[tab]()}</main></div>`}
const go=t=>{tab=t;render();scrollTo(0,0)};



function painel(){const m=month,pl=plan();
const recM=sum(S.incomes.filter(i=>i.status==='recebido'&&i.recvDate.startsWith(m)&&mine(i)).map(i=>i.recvAmt));
const pgM=sum(pays().filter(p=>p.date.startsWith(m)&&mine(p.b)).map(p=>p.amt))+sum(S.fpay.filter(z=>!z.void&&z.date.startsWith(m)&&(scope==='fam'||z.by===S.user)).map(z=>z.amt));
const pend=S.bills.filter(b=>open(b)&&mine(b)),ven=pend.filter(b=>b.due<today());
const tg=sum(S.goals.filter(mineG).map(g=>g.target)),sv=sum(S.goals.filter(mineG).map(gnet));
const al=[];ven.forEach(b=>al.push(['r',`Conta vencida: ${esc(b.name)} (${R(rest(b))})`]));
pend.filter(b=>b.due>=today()&&b.due<=addD(3)).forEach(b=>al.push(['',`Vence em breve: ${esc(b.name)} em ${D(b.due)}`]));
if(S.vr.next&&bal(S.vr)>0&&vrCalc().sug<5&&vrCalc().days>0)al.push(['','O saldo de VR está curto para os dias até a próxima recarga.']);
if(pl.proj<0&&pl.n)al.push(['r','Saldo projetado negativo até o próximo recebimento.']);
const empty=!S.incomes.length&&!S.bills.length;
return`${empty?`<div class="card empty">${PIG.replace('<svg','<svg style="width:70px"')}<p><b>Tudo vazio por aqui.</b><br>Cadastre o primeiro recebimento e as contas do mês.</p><button class="pri sm" onclick="go('receb')">Cadastrar recebimento</button></div>`:''}
${al.map(a=>`<div class="alert ${a[0]}">${a[1]}</div>`).join('')}
<div class="grid"><div class="card wide hero"><small>Dinheiro disponível (confirmado)</small><span class="big">${R(pl.bk)}</span><small>${origem()}</small><small style="display:block">Comprometido até a próxima entrada: ${R(pl.comp)} · Reservado nas metas (família): ${R(sum(S.goals.map(gnet)))} · <a href="#" onclick="cfg();return false">Ajustar</a> · <a href="#" onclick="conciliar();return false">Conciliar</a></small></div>
<div class="card"><small>Recebido no mês</small><span class="big pos">${R(recM)}</span></div><div class="card"><small>Pago no mês</small><span class="big">${R(pgM)}</span></div>
<div class="card"><small>Contas em aberto</small><span class="big ${ven.length?'neg':''}">${R(sum(pend.map(rest)))}</span><small>${pend.length} conta(s), ${ven.length} vencida(s)</small></div>
<div class="card"><small>Próximo recebimento <span class="tag y">previsto</span></small><span class="big">${pl.n?R(pl.n.valor):'—'}</span><small>${pl.n?`${esc(pl.n.who)} · ${D(pl.n.date)}`:'Nenhum cadastrado'}</small></div>
<div class="card wide"><small>🐷 Nosso Porquinho</small><span class="big">${R(sv)} <small>de ${R(tg)}</small></span><div class="bar"><i style="width:${tg?Math.min(100,sv/tg*100):0}%"></i></div></div>
<div class="card wide"><small>VR e VA (não entram no saldo bancário)</small><div class="top"><span><small>VR</small><b class="big">${R(bal(S.vr))}</b></span><span><small>VA</small><b class="big">${R(bal(S.va))}</b></span></div></div></div>
${resumoCard(pl,recM,pgM)}<h2>Próximas contas</h2>${proxContas()}${motiv(sv,tg)}<h2>Atividade recente</h2><div class="card">${S.log.slice(0,8).map(l=>`<div class="it"><div>${esc(l.by)} ${esc(l.msg)}<br><small>${new Date(l.t).toLocaleString('pt-BR')}</small></div></div>`).join('')||'<div class="empty">Nenhuma atividade ainda.</div>'}</div>
<p class="row" style="justify-content:center"><button class="ghost sm" onclick="logout()">Sair</button></p>`}
const addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};

/* Recebimentos */
const TIPOS=['salário','adiantamento','comissão','renda extra','benefício financeiro','outro'];
function receb(){const L=S.incomes.filter(i=>mine(i)&&(i.recvDate||i.date).startsWith(month)&&i.status!=='cancelado').sort((a,b)=>a.date<b.date?-1:1);
const prev=sum(L.map(i=>i.valor)),rc=sum(L.map(rcv));
return`<div class="top"><h2 style="margin:0">Salários e Recebimentos</h2><button class="pri sm" onclick="addInc()">+ Novo</button></div>
<label style="margin-top:10px">Mês<input type="month" value="${month}" onchange="month=this.value||month;render()"></label>
<div class="grid"><div class="card"><small>Total previsto</small><span class="big">${R(prev)}</span></div><div class="card"><small>Efetivamente recebido</small><span class="big pos">${R(rc)}</span></div></div>

function contas(){const all=S.bills.filter(mine).sort((a,b)=>a.due<b.due?-1:1);const L=btab==='pend'?all.filter(open):btab==='paga'?all.filter(b=>!b.cancel&&!open(b)):all;
return`<div class="top"><h2 style="margin:0">Contas e Despesas</h2><button class="pri sm" onclick="addBill()">+ Nova</button></div>

<div class="card">${L.map(b=>{const s=bst(b);return`<div class="it"><div><b>${esc(b.name)}</b><small>${esc(b.cat)} · ${esc(b.who)} · vence ${D(b.due)}${b.rec?' · mensal':''}<br>por ${esc(b.by)}${b.pay.length?` · pago ${R(paid(b))} (${b.pay.map(p=>esc(p.by)).filter((v,i,a)=>a.indexOf(v)===i).join(', ')})`:''}</small></div><div style="text-align:right"><b>${R(open(b)?rest(b):b.amount)}</b><span class="tag ${s[1]}">${s[0]}</span><div class="acts">${open(b)?`<button class="pri sm" onclick="payBill('${b.id}')">Marcar como paga</button>`:''}<button class="ghost sm" onclick="editBill('${b.id}')">Editar</button>${b.pay.some(p=>!p.void)?`<button class="ghost sm" onclick="estorno('${b.id}')">Estornar</button>`:''}<button class="ghost sm dng" onclick="delBill('${b.id}')">Excluir</button></div></div></div>`}).join('')||'<div class="empty">Nada por aqui.</div>'}</div>`}



/* VR e VA */
function vrCalc(){const v=S.vr,t=today(),hol=v.hol.split(',').map(s=>s.trim());let days=0;if(v.next){for(let d=new Date(t+'T12:00');iso(d)<v.next;d.setDate(d.getDate()+1)){const k=iso(d);if(k>t&&v.days.includes(d.getDay())&&!hol.includes(k))days++}}
const b=bal(v),sp=sum(v.sp.filter(s=>s.date===t).map(s=>s.amt));return{b,sp,days,sug:days?b/days:0,over:Math.max(0,sp-v.daily)}}
function vrva(){return`<div class="seg" style="margin-bottom:12px"><button class="${sub==='vr'?'on':''}" onclick="sub='vr';render()">VR · refeição</button><button class="${sub==='va'?'on':''}" onclick="sub='va';render()">VA · alimentação</button></div><p class="sub">Controle separado: nunca entra no saldo bancário nem conta como dinheiro livre.</p>${sub==='vr'?vrView():vaView()}`}
const cur=()=>sub==='vr'?S.vr:S.va;
function mov(x){const all=[...x.rech.map(r=>({...r,k:'rech'})),...x.sp.map(s=>({...s,k:'sp'}))].sort((a,b)=>a.date<b.date?1:-1).slice(0,12);return`<div class="card">${all.map(m=>`<div class="it"><div><b>${m.k==='rech'?'Recarga':esc(m.desc||'Gasto')}</b><small>${D(m.date)} · por ${esc(m.by)}</small></div><b class="${m.k==='rech'?'pos':''}">${m.k==='rech'?'+':'−'}${R(m.amt)}</b><button class="ghost sm dng" onclick="delMov('${m.k}','${m.id}')">✕</button></div>`).join('')||'<div class="empty">Sem movimentações.</div>'}</div>`}
function vrView(){const c=vrCalc();return`<div class="grid"><div class="card wide"><small>Saldo do VR</small><span class="big">${R(c.b)}</span><small>Meta diária de almoço: ${R(S.vr.daily)} · gasto hoje: ${R(c.sp)}</small></div></div>
${c.over>0?`<div class="alert">Você gastou ${R(c.over)} acima da meta hoje. ${c.days?`Para manter o saldo até a próxima recarga, o limite médio sugerido é de ${R(c.sug)} por dia (${c.days} dia(s) de trabalho restantes).`:''}</div>`:c.days?`<div class="card"><small>Estimativa do limite médio nos próximos ${c.days} dia(s) de trabalho (cálculo: saldo ÷ dias restantes até ${D(S.vr.next)})</small><span class="big">${R(c.sug)}/dia</span></div>`:`<div class="alert">Informe a data da próxima recarga em Ajustes para calcular o limite diário.</div>`}
<div class="row" style="justify-content:flex-start;margin:10px 0"><button class="pri sm" onclick="addMov('rech')">+ Recarga</button><button class="pri sm" onclick="addMov('sp')">+ Gasto</button><button class="ghost sm" onclick="vrCfg()">Ajustes</button></div>${mov(S.vr)}`}
function vaView(){const v=S.va,t=today(),mm=t.slice(0,7),spM=sum(v.sp.filter(s=>s.date.startsWith(mm)).map(s=>s.amt)),b=bal(v);const el=Number(t.slice(8)),avg=spM/el;const dleft=v.next?Math.max(0,Math.round((new Date(v.next+'T12:00')-new Date(t+'T12:00'))/864e5)):0;const proj=avg*dleft;const wk=sum(v.sp.filter(s=>s.date>=addD(-6)).map(s=>s.amt));
return`<div class="grid"><div class="card"><small>Saldo real do VA</small><span class="big">${R(b)}</span></div><div class="card"><small>Meta mensal de mercado</small><span class="big">${R(v.goal)}</span><small>gasto no mês: ${R(spM)}</small></div></div>
${v.goal>0?`<div class="bar"><i style="width:${Math.min(100,spM/v.goal*100)}%"></i></div>`:''}
${v.week>0&&wk>v.week?`<div class="alert r">Últimos 7 dias: ${R(wk)}, acima do limite semanal de ${R(v.week)}.</div>`:v.week>0?`<p class="sub">Últimos 7 dias: ${R(wk)} de ${R(v.week)} (limite semanal).</p>`:''}
${v.next?`<div class="card"><small>Projeção (estimativa pela média diária do mês, ${dleft} dia(s) até a recarga)</small><b class="${proj>b?'neg':'pos'}">${proj>b?'O saldo pode não ser suficiente':'O saldo deve ser suficiente'}</b><small><br>Gasto projetado ${R(proj)} · saldo ${R(b)}</small></div>`:'<p class="sub">Informe a data da próxima recarga em Ajustes para ver a projeção.</p>'}
<div class="row" style="justify-content:flex-start;margin:10px 0"><button class="pri sm" onclick="addMov('rech')">+ Recarga</button><button class="pri sm" onclick="addMov('sp')">+ Compra</button><button class="ghost sm" onclick="vaCfg()">Ajustes</button></div>${mov(v)}`}




/* Porquinho */
function porco(){const g=S.goals.filter(mineG);return`<div class="top"><h2 style="margin:0">🐷 Nosso Porquinho</h2><button class="pri sm" onclick="addGoal()">+ Nova meta</button></div><p class="sub">Controle de metas. Guardar aqui é uma transferência interna: sai do saldo disponível e entra no reservado, sem criar receita nem despesa. O app não move dinheiro real.</p>${porcoTop()}
${g.map(x=>{const s=gnet(x),r=Math.max(0,x.target-s),pc=x.target?Math.min(100,s/x.target*100):0;const ml=Math.max(1,Math.ceil((new Date(x.due+'T12:00')-new Date())/(864e5*30.4)));const late=x.due<today()&&r>0;
return`<div class="card"><div class="top"><b>${esc(x.name)}</b> <small>${esc(x.owner||'Família')} · ${x.dep==='Depositado ou investido'?'depositado ou investido':'só reservado no controle'}</small><span class="tag ${late?'r':''}">${pc.toFixed(0)}%</span></div><div class="bar gb"><i style="width:${pc}%"></i></div><small>${R(s)} de ${R(x.target)} · faltam ${R(r)} · prazo ${D(x.due)}${x.where?` · guardado em ${esc(x.where)}`:''}</small>
<p class="sub">${r<=0?'Meta atingida! 🎉':late?'Prazo vencido: revise a meta ou estenda o prazo.':`Para chegar lá: ${R(r/ml)}/mês nos ${ml} mês(es) restantes (restante ÷ meses até o prazo). Se guardar menos num mês, o valor dos meses seguintes sobe, ou o prazo precisa ser estendido.`}</p>
${scen(x,r,ml)}<div class="acts" style="justify-content:flex-start"><button class="pri sm" onclick="moveGoal('${x.id}')">Guardar / retirar</button><button class="ghost sm" onclick="replan('${x.id}')">Replanejar</button><button class="ghost sm dng" onclick="delGoal('${x.id}')">Excluir</button></div>
${x.moves.slice(-3).reverse().map(m=>`<small style="display:block">${D(m.date)} · ${esc(m.by)} ${m.amt>0?'guardou':'retirou'} ${R(Math.abs(m.amt))}</small>`).join('')}</div>`}).join('')||'<div class="card empty">Crie metas como reserva de emergência, apartamento ou viagem.</div>'}`}

let pg=null;
function plano(){const p=plan();return`<h2 style="margin-top:0">Até o próximo recebimento</h2>
<div class="card"><div class="it"><div>Saldo bancário atual <span class="tag">confirmado</span></div><b>${R(p.bk)}</b></div>
<div class="it"><div>Próxima entrada <span class="tag y">prevista</span><br><small>${p.n?`${esc(p.n.desc)} · ${D(p.n.date)}`:'nenhuma cadastrada'}</small></div><b>${p.n?R(p.n.valor):'—'}</b></div>
<div class="it"><div>Contas até lá<br><small>${p.before.map(b=>`${esc(b.name)} (${D(b.due)})`).join(', ')||'nenhuma'}</small></div><b class="neg">−${R(p.comp)}</b></div>
<div class="it"><div>Margem de segurança <a href="#" onclick="cfg();return false"><small>editar</small></a></div><b>−${R(S.margin)}</b></div>
<div class="it"><div><b>Disponível para gastar antes da entrada</b><br><small>Não inclui a entrada prevista, VR nem VA</small></div><b class="big ${p.proj<0?'neg':'pos'}">${R(p.proj)}</b></div></div>
<h2>Posso gastar?</h2><div class="card"><form onsubmit="return pode(this)"><label>Valor da compra (R$)<input name="v" type="number" step="0.01" min="0.01" required></label><label>Parcelas no cartão (1 = à vista)<input name="n" type="number" min="1" max="48" value="1"></label><button class="pri">Calcular</button></form>${pg?`<div style="margin-top:12px" class="alert ${pg.c}"><b>${pg.t}</b><br>${pg.m}</div>`:''}</div>`}
function pode(f){const v=num(f.v.value),p=plan();if(v<=0)return false;const n=Math.max(1,Math.min(48,parseInt(f.n.value)||1)),par=Math.round(v/n*100)/100,after=p.proj-par;let t,c,m;
const calc=`Cálculo: saldo ${R(p.bk)} − contas até a próxima entrada ${R(p.comp)} − margem ${R(S.margin)} − ${n>1?`1ª parcela (${n}x de ${R(par)})`:'compra'} ${R(par)} = ${R(after)}.${n>1?` No cartão o valor não sai do saldo hoje; as parcelas entram nas faturas dos próximos ${n} meses (total ${R(v)}).`:''} VR/VA e recebimentos previstos não entram.`;
if(after>=0&&after>=p.bk*0.1){t='Compatível com o planejamento';c=''}else if(after>=0){t='Possível, mas exige atenção';c=''}else{t='Não recomendado com os dados atuais';c='r'}
if(after>=0&&after<p.bk*0.1){c=' '}pg={t,c:c.trim(),m:calc};render();return false}

function hist(){return`<h2 style="margin-top:0">Histórico de atividades</h2><div class="card">${S.log.map(l=>`<div class="it"><div>${esc(l.by)} ${esc(l.msg)}<br><small>${new Date(l.t).toLocaleString('pt-BR')}</small></div></div>`).join('')||'<div class="empty">As ações de vocês aparecerão aqui, com quem fez e quando.</div>'}</div><p class="sub">Mostra as últimas 60 ações. Pagamentos, recebimentos e transferências continuam guardados nos próprios registros.</p>`}



function origem(){const r=sum(S.incomes.map(rcv)),p=sum(pays().map(x=>x.amt))+fp(),g=sum(S.goals.map(gnet)),a=sum(S.adj.map(x=>x.amt));return`Inicial ${R(S.opening)} + recebido ${R(r)} − pago ${R(p)} − reservado ${R(g)}${a?` ${a>0?'+':'−'} ajuste ${R(Math.abs(a))}`:''}`}



let dx=0;const fp=()=>sum(S.fpay.filter(z=>!z.void).map(z=>z.amt));
const ymOf=(y,m)=>{const t=new Date(y,m-1,1);return`${t.getFullYear()}-${p2(t.getMonth()+1)}`};
function insts(p){const c=S.cards.find(x=>x.id===p.cardId),[y,m,d]=p.date.split('-').map(Number),per=Math.floor(p.total/p.n*100)/100;return Array.from({length:p.n},(_,i)=>({i:i+1,ym:ymOf(y,m+(d>c.close?1:0)+i),amt:i===p.n-1?Math.round((p.total-per*(p.n-1))*100)/100:per}))}
function fat(c){const mp={};S.purchases.filter(p=>p.cardId===c.id&&!p.void).forEach(p=>insts(p).forEach(x=>{const f=mp[x.ym]=mp[x.ym]||{ym:x.ym,tot:0,items:[]};f.tot+=x.amt;f.items.push({p,...x})}));return Object.values(mp).map(f=>{f.tot=Math.round(f.tot*100)/100;f.paid=sum(S.fpay.filter(z=>z.cardId===c.id&&z.ym===f.ym&&!z.void).map(z=>z.amt));f.rest=Math.max(0,Math.round((f.tot-f.paid)*100)/100);f.due=c.due>c.close?`${f.ym}-${p2(c.due)}`:addM(`${f.ym}-${p2(c.due)}`);return f}).sort((a,b)=>a.ym<b.ym?-1:1)}
function fatBills(lim){const L=lim||addD(45);return S.cards.flatMap(c=>fat(c).filter(f=>f.rest>0&&f.due<=L).map(f=>({id:'f'+c.id+f.ym,name:`Fatura ${c.name}`,amount:f.rest,due:f.due,pay:[]})))}
function payoff(extra,st){const ds=S.debts.filter(d=>d.bal>0.005).map(d=>({...d}));let m=0,int=0;while(ds.some(d=>d.bal>0.005)&&m<600){m++;ds.forEach(d=>{const j=d.bal*d.rate/100;d.bal+=j;int+=j});let pool=sum(ds.filter(d=>d.bal>0.005).map(d=>d.pmt))+extra;ds.forEach(d=>{if(d.bal>0.005){const q=Math.min(d.pmt,d.bal);d.bal-=q;pool-=q}});const o=ds.filter(d=>d.bal>0.005).sort(st==='av'?(a,b)=>b.rate-a.rate:(a,b)=>a.bal-b.bal);for(const d of o){if(pool<=0)break;const q=Math.min(pool,d.bal);d.bal-=q;pool-=q}}return{m,int:Math.round(int*100)/100,ok:m<600}}
function cartoes(){return`<h2 style="margin-top:0">Cartões e dívidas</h2><div class="row" style="justify-content:flex-start;margin:10px 0"><button class="pri sm" onclick="addCard()">+ Cartão</button><button class="pri sm" onclick="addPurch()">+ Compra no cartão</button><button class="ghost sm" onclick="addDebt()">+ Dívida</button></div><p class="sub">A compra no cartão não reduz o saldo: só o pagamento da fatura sai do dinheiro disponível, uma única vez. As parcelas entram nas faturas dos meses corretos.</p>${S.cards.map(cardView).join('')||'<div class="card empty">Cadastre um cartão para registrar compras e acompanhar as faturas.</div>'}<h2>Dívidas e financiamentos</h2>${debtView()}`}
function cardView(c){const F=fat(c),used=sum(F.map(f=>f.rest)),ps=S.purchases.filter(p=>p.cardId===c.id&&!p.void).slice(-5).reverse(),from=addM(today(),-1).slice(0,7);return`<div class="card"><div class="top"><b>${esc(c.name)}</b><small>fecha dia ${c.close} · vence dia ${c.due}</small></div><small>Comprometido: ${R(used)}${c.limit?` de ${R(c.limit)} de limite`:''}</small>${c.limit?`<div class="bar"><i style="width:${Math.min(100,used/c.limit*100)}%"></i></div>`:''}${F.filter(f=>f.rest>0||f.ym>=from).map(f=>{const st=f.rest<=0?['paga','']:f.due<today()?['vencida','r']:['aberta','y'];return`<div class="it"><div><b>Fatura ${f.ym.split('-').reverse().join('/')}</b><small>vence ${D(f.due)} · ${f.items.length} item(ns)${f.paid?` · pago ${R(f.paid)}`:''}</small></div><div style="text-align:right"><b>${R(f.rest>0?f.rest:f.tot)}</b><span class="tag ${st[1]}">${st[0]}</span>${f.rest>0?`<div class="acts"><button class="pri sm" onclick="payFat('${c.id}','${f.ym}')">Pagar fatura</button></div>`:''}</div></div>`}).join('')||'<div class="empty">Sem faturas.</div>'}${ps.map(p=>`<small style="display:block">${D(p.date)} · ${esc(p.desc)} · ${p.n>1?`${p.n}x de ${R(p.total/p.n)}`:R(p.total)} · ${esc(p.who)} <a href="#" onclick="voidPurch('${p.id}');return false">cancelar</a></small>`).join('')}</div>`}
function debtView(){const L=S.debts;if(!L.length)return'<div class="card empty">Cadastre empréstimos ou financiamentos para comparar estratégias de quitação.<br>As parcelas continuam sendo pagas em <b>Contas</b>, para não contar duas vezes.</div>';const a=payoff(dx,'av'),s=payoff(dx,'sn');return`<div class="card">${L.map(d=>`<div class="it"><div><b>${esc(d.name)}</b><small>juros ${d.rate}% ao mês (≈ ${R(d.bal*d.rate/100)}/mês) · parcela ${R(d.pmt)}</small></div><div style="text-align:right"><b>${R(d.bal)}</b><div class="acts"><button class="ghost sm" onclick="updDebt('${d.id}')">Atualizar saldo</button><button class="ghost sm dng" onclick="delDebt('${d.id}')">Excluir</button></div></div></div>`).join('')}</div>${L.filter(d=>d.bal>0.005).length>1?`<div class="card"><b>Comparar estratégias (estimativa)</b><form onsubmit="dx=num(this.x.value);render();return false"><label>Valor extra por mês (R$)<input name="x" type="number" step="0.01" min="0" value="${dx}"></label><button class="ghost sm">Comparar</button></form>${[['Avalanche (maior juros primeiro)',a],['Bola de neve (menor saldo primeiro)',s]].map(x=>`<div class="it"><div><b>${x[0]}</b></div><div style="text-align:right">${x[1].ok?`${x[1].m} meses · juros ≈ ${R(x[1].int)}`:'não quita em 50 anos'}</div></div>`).join('')}<small>Simulação simplificada: juros mensais fixos sobre o saldo informado, sem tarifas.</small></div>`:''}`}

function render(){if(phase!=='app'){document.getElementById('app').innerHTML=gate();return}renderApp()}
function gate(){if(phase==='loading')return`<div class="auth">${PIG}<p class="sub" role="status">Carregando…</p></div>`;

const amsg=t=>{const e=document.getElementById('amsg');if(e)e.textContent=t};
async function doAuth(f){const b=f.querySelector('.pri');b.disabled=true;amsg('');try{const e=f.e.value.trim(),p=f.p.value;if(mode==='up'){const r=await sb.auth.signUp({email:e,password:p,options:{data:{display_name:f.n.value.trim()}}});if(r.error)throw new Error(trErr(r.error.message));if(!r.data.session){mode='in';render();amsg('Enviamos um e-mail de confirmação. Confirme e depois entre.');return}await afterLogin(r.data.session.user)}else{const r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)throw new Error(r.error.message==='Invalid login credentials'?'E-mail ou senha incorretos.':trErr(r.error.message));await afterLogin(r.data.user)}}catch(x){amsg(x.message);b.disabled=false}}
async function afterLogin(user){S=freshS();S.uid=user.id;try{const m=await must(sb.from('family_members').select('family_id,role').eq('user_id',user.id));if(!m.length){phase='family';render();return}S.fam=m[0].family_id;await must(sb.rpc('generate_recurrences',{p_family:S.fam}));await load();phase='app';render()}catch(e){phase='login';render();amsg(e.message)}}
async function doFam(f){const b=f.querySelector('.pri');b.disabled=true;try{const id=await must(sb.rpc('create_family',{p_name:f.n.value}));await must(sb.from('accounts').insert({family_id:id,name:'Conta principal',opening_balance:0}));const u=(await sb.auth.getUser()).data.user;await afterLogin(u)}catch(e){amsg(e.message);b.disabled=false}}
async function joinFam(){try{await must(sb.rpc('accept_invite'));const u=(await sb.auth.getUser()).data.user;await afterLogin(u)}catch(e){amsg(e.message)}}
async function logout(){try{await sb.auth.signOut()}catch(e){}S=freshS();phase='login';mode='in';render()}

sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&phase==='app'){S=freshS();phase='login';render()}});

function addBill(){form('Nova conta',[{k:'name',l:'Nome',req:1},{k:'cat',l:'Categoria',list:'cats',v:'Outras',req:1},{k:'amount',l:'Valor (R$)',t:'number',req:1},{k:'due',l:'Vencimento',t:'date',v:today(),req:1},whoF(),{k:'rec',l:'Recorrência',t:'select',o:['Não repete','Mensal']}],async d=>{const v=num(d.amount);if(v<=0){toast('Informe um valor maior que zero');return false}if(S.bills.some(b=>b.name.toLowerCase()===d.name.trim().toLowerCase()&&b.due===d.due)){toast('Já existe uma conta igual nesse vencimento');return false}const rec=d.rec==='Mensal';await must(sb.from('bills').insert({family_id:S.fam,series_id:rec?key():null,name:d.name.trim(),category:d.cat,amount:v,due_date:d.due,responsible:U(d.who),is_recurring:rec}));if(rec)await must(sb.rpc('generate_recurrences',{p_family:S.fam}));toast('Conta cadastrada')})}
function editBill(id){const b=S.bills.find(x=>x.id===id);form('Editar conta',[{k:'name',l:'Nome',v:b.name,req:1},{k:'cat',l:'Categoria',list:'cats',v:b.cat,req:1},{k:'amount',l:'Valor (R$)',t:'number',v:b.amount,req:1},{k:'due',l:'Vencimento desta ocorrência',t:'date',v:b.due,req:1},whoF(b.who),...(b.rec?[{k:'sc',l:'Aplicar a',t:'select',o:['Só esta ocorrência','Esta e as próximas em aberto']}]:[])],async d=>{const v=num(d.amount);if(v<=0||v<paid(b)-0.004){toast(`O valor não pode ser menor que o já pago (${R(paid(b))})`);return false}const ser=b.rec&&d.sc==='Esta e as próximas em aberto',L=ser?S.bills.filter(x=>x.ser===b.ser&&x.due>=b.due&&!x.cancel&&(x.id===b.id||paid(x)<0.004)):[b];await must(sb.from('bills').update({name:d.name.trim(),category:d.cat,responsible:U(d.who),amount:v}).in('id',L.map(x=>x.id)));if(d.due!==b.due)await must(sb.from('bills').update({due_date:d.due}).eq('id',b.id))})}
function payBill(id){const b=S.bills.find(x=>x.id===id),k=key();form(`Pagar: ${esc(b.name)}`,[{k:'amt',l:'Valor pago (R$)',t:'number',v:rest(b),req:1},{k:'date',l:'Data do pagamento',t:'date',v:today(),req:1},{k:'m',l:'Forma de pagamento',t:'select',o:['Pix','Débito','Cartão de crédito','Boleto','Dinheiro','Outra']}],async d=>{const v=num(d.amt);if(bad(d.date))return false;if(v<=0||v>rest(b)+0.004){toast(`Valor deve ser entre 0,01 e ${R(rest(b))}`);return false}await must(sb.rpc('pay_bill',{p_bill:id,p_amount:v,p_date:d.date,p_method:d.m,p_key:k}));if(b.rec)await must(sb.rpc('generate_recurrences',{p_family:S.fam}));toast(v>=rest(b)-0.004?'Conta paga':'Pagamento parcial registrado')},'Confirmar pagamento',`Restante em aberto: ${R(rest(b))}. Pagamento parcial mantém só o saldo restante como pendente.`)}
function estorno(id){const b=S.bills.find(x=>x.id===id),p=[...b.pay].reverse().find(x=>!x.void);if(!p)return;ask('Estornar pagamento?',`Estorna ${R(p.amt)} pago em ${D(p.date)}. O registro fica no histórico como estornado e o valor volta a ficar pendente.`,async()=>{await must(sb.rpc('void_bill_payment',{p_payment:p.id}))})}
function delBill(id){const b=S.bills.find(x=>x.id===id);ask('Cancelar conta?',b.pay.length?'Os pagamentos já feitos continuam no saldo e no histórico; só o restante deixa de ser cobrado.':'A conta fica no histórico como cancelada e deixa de ser cobrada.',async()=>{await must(sb.from('bills').update({cancelled_at:new Date().toISOString(),cancelled_by:S.uid}).eq('id',id))})}

function addPurch(){if(!S.cards.length){toast('Cadastre um cartão primeiro');return}form('Compra no cartão',[{k:'card',l:'Cartão',t:'select',o:S.cards.map(c=>c.name)},{k:'desc',l:'Descrição',req:1},{k:'cat',l:'Categoria',list:'cats',v:'Outras',req:1},{k:'total',l:'Valor total (R$)',t:'number',req:1},{k:'n',l:'Parcelas',t:'number',v:1,req:1},{k:'date',l:'Data da compra',t:'date',v:today(),req:1},whoF()],async d=>{const t=num(d.total),n=parseInt(d.n);if(t<=0||!(n>=1&&n<=48)){toast('Valor e parcelas (1 a 48) inválidos');return false}if(bad(d.date))return false;const c=S.cards.find(x=>x.name===d.card);await must(sb.from('card_purchases').insert({family_id:S.fam,card_id:c.id,description:d.desc.trim(),category:d.cat,total:t,installments:n,purchase_date:d.date,responsible:U(d.who)}));toast('Compra registrada')})}
function payFat(cid,ym){const c=S.cards.find(x=>x.id===cid),f=fat(c).find(x=>x.ym===ym),k=key();form(`Pagar fatura ${esc(c.name)} ${ym.split('-').reverse().join('/')}`,[{k:'amt',l:'Valor pago (R$)',t:'number',v:f.rest,req:1},{k:'date',l:'Data do pagamento',t:'date',v:today(),req:1}],async d=>{const v=num(d.amt);if(bad(d.date))return false;if(v<=0||v>f.rest+0.004){toast(`Valor deve ser entre 0,01 e ${R(f.rest)}`);return false}await must(sb.rpc('pay_card_invoice',{p_card:cid,p_ym:ym,p_amount:v,p_date:d.date,p_key:k}));toast('Fatura paga')},'Confirmar pagamento',`Restante da fatura: ${R(f.rest)}. Isso sai do saldo uma única vez; as compras da fatura já não contam separadamente.`)}

function moveGoal(id){const g=S.goals.find(x=>x.id===id),k=key();form(`Meta: ${esc(g.name)}`,[{k:'t',l:'Operação',t:'select',o:['Guardar','Retirar']},{k:'amt',l:'Valor (R$)',t:'number',req:1},{k:'date',l:'Data',t:'date',v:today(),req:1}],async d=>{let v=num(d.amt);if(v<=0||bad(d.date))return false;if(d.t==='Guardar'){if(v>bank()+0.004){toast(`Saldo bancário insuficiente (${R(bank())})`);return false}}else{if(v>gnet(g)+0.004){toast('Retirada maior que o valor guardado');return false}v=-v}await must(sb.rpc('move_goal',{p_goal:id,p_amount:v,p_date:d.date,p_key:k}));toast('Transferência interna registrada')})}

/* ----- saldo, categorias ----- */
function cfg(){form('Configurações',[{k:'o',l:'Saldo bancário inicial (R$)',t:'number',v:S.opening},{k:'m',l:'Margem de segurança (R$)',t:'number',v:S.margin}],async d=>{await must(sb.from('settings').update({safety_margin:num(d.m)}).eq('family_id',S.fam));if(S.acc)await must(sb.from('accounts').update({opening_balance:num(d.o)}).eq('id',S.acc));else await must(sb.from('accounts').insert({family_id:S.fam,name:'Conta principal',opening_balance:num(d.o)}))})}
function conciliar(){const k=key();form('Conciliar com o saldo real',[{k:'v',l:'Saldo real no banco hoje (R$)',t:'number',req:1}],async d=>{const r=await must(sb.rpc('reconcile_balance',{p_family:S.fam,p_real:num(d.v),p_key:k}));toast(Number(r)===0?'Já confere com o app':'Ajuste de conciliação registrado')},'Conciliar',`O app calcula ${R(bank())}. Se o valor real for diferente, será registrado um ajuste rastreável (não é receita nem despesa).`)}
const upRule=(c,ml,es)=>must(sb.from('category_rules').upsert({family_id:S.fam,category:c,monthly_limit:ml,essential:es},{onConflict:'family_id,category'}));
function setLim(c,v){c=dq(c);act(()=>upRule(c,v,!!S.ess[c]))}
function togEss(c){c=dq(c);act(()=>upRule(c,S.lim[c]||null,!S.ess[c]))}
function limForm(c){c=dq(c);form(`Limite mensal: ${esc(c)}`,[{k:'v',l:'Limite (R$). Use 0 para remover',t:'number',v:S.lim[c]||0}],async d=>{const v=num(d.v);await upRule(c,v>0?v:null,!!S.ess[c])})}

splashAndStart();boot();
</script></body></html>
